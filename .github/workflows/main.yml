name: Deploy CR Management

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy to server
        run: |
          set -e
          cd /var/www/cr-management-system
          git fetch origin master
          git reset --hard origin/master
          npm install
          npm run build
          sudo systemctl restart cr-management || true
          sudo systemctl status cr-management --no-pager || true
